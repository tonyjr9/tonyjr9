name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rsvg-convert
        run: sudo apt-get install -y librsvg2-bin

      - name: Fetch and convert stats cards
        run: |
          curl -sL "https://github-readme-stats-topedro.vercel.app/api?username=tonyjr9&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true" -o stats_raw.svg
          curl -sL "https://github-readme-stats-topedro.vercel.app/api/top-langs/?username=tonyjr9&layout=compact&theme=tokyonight&hide_border=true&count_private=true&langs_count=9" -o langs_raw.svg
          rsvg-convert -f png -o stats.png stats_raw.svg
          rsvg-convert -f png -o langs.png langs_raw.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.png langs.png
          git diff --staged --quiet || git commit -m "chore: update stats cards"
          git push
